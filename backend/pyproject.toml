[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "som-accounting-reconciliation"
version = "0.1.0"
description = "Read-only OpenERP and Odoo accounting movement comparison"
requires-python = ">=3.12"
dependencies = ["Flask>=3.0,<4", "gunicorn>=23,<24", "erppeek==1.7.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
accounting-reconciliation = "app.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]
